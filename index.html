<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A same-origin file (not an inline script) so it runs under the app's CSP (script-src
         'self', no 'unsafe-inline') -- see public/theme-init.js. Placed before every stylesheet
         in <head>: Vite injects the built stylesheet <link> at the end of <head>, so this
         always runs first and the page never flashes the wrong theme on load. -->
    <meta name="theme-color" content="#e8f2f5" />
    <script src="/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Wayline AI — multimodal journey assurance for public and intercity transportation."
    />
    <title>Wayline — Travel workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
